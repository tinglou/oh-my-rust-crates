[package]
name = "cargo-undep"
version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
description = "Find unused workspace dependencies and hoist member dependencies in a Cargo workspace"
readme = "README.md"
keywords = ["cargo", "cargo-subcommand", "workspace", "dependencies", "unused"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[features]
clap-cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage"], optional = true }
glob = "0.3"
toml_edit = "0.25"
