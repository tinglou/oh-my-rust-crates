[package]
name = "erfs-rt"
description = "Embedded Resource Filesystem: no_std runtime to read embedded or owned ERFS images"

categories = [
    "filesystem",
    "no-std",
    "embedded",
] # https://crates.io/category_slugs
documentation = "https://docs.rs/erfs-rt/"
keywords = ["embedded", "resources", "filesystem", "no-std"]

version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]
erfs-gen = { path = "../erfs-gen", version = "0.2.0"}
