[package]
name = "erfs-rt"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
authors = ["Lou, Ting <ting.lou@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/tinglou/erfs"
homepage = "https://github.com/tinglou/erfs"
description = "Embedded Resource Filesystem: no_std runtime to read embedded or owned ERFS images."
keywords = ["embedded", "resources", "filesystem", "no-std"]
categories = ["no-std", "filesystem", "embedded"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]
erfs-gen = { path = "../erfs-gen" }
