[package]
name = "erfs-gen"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
authors = ["Lou, Ting <ting.lou@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/tinglou/erfs"
homepage = "https://github.com/tinglou/erfs"
description = "Embedded Resource Filesystem: library and command line tool to generate ERFS images."
keywords = ["embedded", "resources", "filesystem", "codegen"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[lib]
name = "erfs_gen"
path = "src/lib.rs"

[[bin]]
name = "erfs-gen"
path = "src/main.rs"

[dependencies]
