[package]
name = "erfs-gen"
description = "Embedded Resource Filesystem: library and command line tool to generate ERFS images"

categories = [
    "development-tools::build-utils",
    "command-line-utilities",
] # https://crates.io/category_slugs
documentation = "https://docs.rs/erfs-gen/"
keywords = ["embedded", "resources", "filesystem", "codegen"]

version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
name = "erfs_gen"
path = "src/lib.rs"

[[bin]]
name = "erfs-gen"
path = "src/main.rs"

[dependencies]
