[package]
name = "macaddr-ouidb"
description = "Mac Address and OUI(Organizationally Unique Identifiers) database"

categories = [
    "network-programming",
    "no-std::no-alloc",
    "no-std",
] # https://crates.io/category_slugs
documentation = "https://docs.rs/macaddr-ouidb/"
keywords = ["mac", "oui", "eui48", "wireshark", "lookup"]

version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["std", "serde", "pnet"]

std = [
    "pnet_base/std",
    "serde/std",
    "thiserror/std",
    "macaddr-ouidb-support/std",
    "dep:arc-swap",
]
pnet = []
serde = ["dep:serde"]
fullname = []
address = []

[[bin]]
name = "mac-oui"
path = "src/main.rs"

[dependencies]
pnet_base = { version = "0.35.0", default-features = false }
serde = { version = "1.0.228", default-features = false, optional = true }
thiserror = { version = "2.0.18", default-features = false }
macaddr-ouidb-support = { path = "../macaddr-ouidb-support", version = "0.2.2", default-features = false }
arc-swap = { version = "1.9", optional = true }

[build-dependencies]
macaddr-ouidb-support = { path = "../macaddr-ouidb-support", version = "0.2.2" }

[dev-dependencies]
serde_json = "1.0"
