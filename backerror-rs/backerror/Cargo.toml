[package]
name = "backerror"
description = "Java style backtrace for Rust"
categories = [
    "rust-patterns",
    "development-tools::debugging",
    "no-std",
] # https://crates.io/category_slugs
documentation = "https://docs.rs/backerror/"
keywords = ["error", "error-handling", "backtrace", "stacktrace", "thiserror"]

version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true


[dependencies]
backerror-macros = { path = "../backerror-macros", version = "0.2.0" }


[dev-dependencies]
thiserror = "2"

[features]
default = ["force_backtrace", "release_off"]

# force backtrace even if environment variable is not set
force_backtrace = ["backtrace"]

# only if environment variable RUST_BACKTRACE or RUST_LIB_BACKTRACE is set
backtrace = ["std"]

# turn off attribute macro in release mode
release_off = []

std = []
